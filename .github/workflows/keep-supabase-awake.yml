name: Keep Supabase awake

# El plan gratis de Supabase pausa el proyecto tras ~7 días sin actividad.
# Esta tarea hace una consulta de lectura cada 3 días para evitarlo.
on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query questions table
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
            -H "apikey: $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/questions?select=qid&limit=1")
          echo "HTTP $code"
          test "$code" = "200"
